<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Realistic city skyline">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa6b8"/>
      <stop offset="1" stop-color="#cfd6da"/>
    </linearGradient>
    <linearGradient id="pB1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74838f"/><stop offset="1" stop-color="#5b6873"/></linearGradient>
    <linearGradient id="pB2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7a86"/><stop offset="1" stop-color="#4f5c66"/></linearGradient>
    <linearGradient id="pB3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8b96"/><stop offset="1" stop-color="#616e78"/></linearGradient>
    <linearGradient id="pB4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f6e7a"/><stop offset="1" stop-color="#46525b"/></linearGradient>
    <linearGradient id="pB5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78868f"/><stop offset="1" stop-color="#5a666f"/></linearGradient>
    <linearGradient id="pGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f6f5c"/><stop offset="1" stop-color="#4a5848"/></linearGradient>
    <pattern id="pWin" width="34" height="36" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="16" height="18" rx="2" fill="#cdd6dc" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#pSky)"/>
  <circle cx="650" cy="95" r="42" fill="#e9e2c9" opacity="0.9"/>
  <g fill="#e6ebee" opacity="0.7">
    <ellipse cx="150" cy="92" rx="70" ry="26"/>
    <ellipse cx="205" cy="80" rx="52" ry="22"/>
    <ellipse cx="470" cy="62" rx="62" ry="20"/>
  </g>

  <g>
    <rect x="60" y="250" width="110" height="220" fill="url(#pB1)"/>
    <rect x="60" y="250" width="110" height="220" fill="url(#pWin)"/>
    <rect x="190" y="180" width="130" height="290" fill="url(#pB2)"/>
    <rect x="190" y="180" width="130" height="290" fill="url(#pWin)"/>
    <rect x="340" y="230" width="120" height="240" fill="url(#pB3)"/>
    <rect x="340" y="230" width="120" height="240" fill="url(#pWin)"/>
    <rect x="480" y="150" width="140" height="320" fill="url(#pB4)"/>
    <rect x="480" y="150" width="140" height="320" fill="url(#pWin)"/>
    <rect x="640" y="260" width="110" height="210" fill="url(#pB5)"/>
    <rect x="640" y="260" width="110" height="210" fill="url(#pWin)"/>
  </g>

  <g fill="#5c6b59" opacity="0.9">
    <rect x="150" y="430" width="8" height="40"/>
    <circle cx="154" cy="424" r="20"/>
    <rect x="710" y="432" width="8" height="38"/>
    <circle cx="714" cy="426" r="18"/>
  </g>

  <rect x="0" y="470" width="800" height="30" fill="url(#pGround)"/>
</svg>
