<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="The same city skyline as a cartoon">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#eafaff"/>
    </linearGradient>
    <pattern id="cWin" width="34" height="36" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="18" height="20" rx="5" fill="#ffe066" stroke="#1b1b2f" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#cSky)"/>

  <!-- doodle sparkles -->
  <g stroke="#ff5d8f" stroke-width="5" stroke-linecap="round">
    <path d="M110 60 v22 M99 71 h22"/>
    <path d="M300 40 v18 M291 49 h18"/>
    <path d="M540 120 v18 M531 129 h18"/>
  </g>
  <g stroke="#7c5cff" stroke-width="5" stroke-linecap="round">
    <path d="M740 200 v20 M730 210 h20"/>
    <path d="M40 210 v18 M31 219 h18"/>
  </g>

  <!-- sun with a face -->
  <g>
    <circle cx="650" cy="95" r="45" fill="#ffd23f" stroke="#1b1b2f" stroke-width="6"/>
    <circle cx="636" cy="88" r="4.5" fill="#1b1b2f"/>
    <circle cx="664" cy="88" r="4.5" fill="#1b1b2f"/>
    <path d="M636 106 q14 13 28 0" fill="none" stroke="#1b1b2f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- puffy clouds -->
  <g fill="#ffffff" stroke="#1b1b2f" stroke-width="6" stroke-linejoin="round">
    <path d="M120 100 q0 -30 30 -30 q10 -22 38 -14 q16 -20 42 -4 q28 0 26 30 q14 8 6 22 h-136 q-14 -4 -6 -4 z"/>
    <path d="M430 70 q0 -24 24 -24 q10 -16 32 -10 q24 -2 24 22 q12 6 6 18 h-80 q-10 -2 -6 -6 z"/>
  </g>

  <!-- buildings -->
  <g stroke="#1b1b2f" stroke-width="6" stroke-linejoin="round">
    <rect x="60" y="250" width="110" height="220" rx="10" fill="#ff9ec2"/>
    <rect x="190" y="180" width="130" height="290" rx="10" fill="#7c5cff"/>
    <rect x="340" y="230" width="120" height="240" rx="10" fill="#2ec4b6"/>
    <rect x="480" y="150" width="140" height="320" rx="10" fill="#ff7a3d"/>
    <rect x="640" y="260" width="110" height="210" rx="10" fill="#4cc38a"/>
  </g>
  <g>
    <rect x="60" y="250" width="110" height="220" fill="url(#cWin)"/>
    <rect x="190" y="180" width="130" height="290" fill="url(#cWin)"/>
    <rect x="340" y="230" width="120" height="240" fill="url(#cWin)"/>
    <rect x="480" y="150" width="140" height="320" fill="url(#cWin)"/>
    <rect x="640" y="260" width="110" height="210" fill="url(#cWin)"/>
  </g>

  <!-- trees with faces -->
  <g stroke="#1b1b2f" stroke-width="6" stroke-linecap="round">
    <rect x="150" y="430" width="8" height="40" fill="#a86a3d"/>
    <circle cx="154" cy="424" r="22" fill="#4cc38a"/>
    <circle cx="148" cy="420" r="3" fill="#1b1b2f" stroke="none"/>
    <circle cx="162" cy="420" r="3" fill="#1b1b2f" stroke="none"/>
    <rect x="710" y="432" width="8" height="38" fill="#a86a3d"/>
    <circle cx="714" cy="426" r="20" fill="#4cc38a"/>
    <circle cx="709" cy="422" r="3" fill="#1b1b2f" stroke="none"/>
    <circle cx="721" cy="422" r="3" fill="#1b1b2f" stroke="none"/>
  </g>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="30" fill="#ffd23f" stroke="#1b1b2f" stroke-width="6"/>
</svg>
